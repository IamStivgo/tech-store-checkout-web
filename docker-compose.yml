name: tech-store-checkout

# The whole store locally: web, API and DynamoDB Local, with the fake payment provider.
# Needs the api repository cloned next to this one (../tech-store-checkout-api).
#   docker compose up --build   → http://localhost:8080 (WEB_PORT=8088 to use another port)
#   docker compose down -v      → stops everything and deletes the data

include:
  - ../tech-store-checkout-api/docker-compose.yml

services:
  web:
    build: .
    image: tech-store-checkout-web:local
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
